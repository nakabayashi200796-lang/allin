<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オールイン勝負</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0d0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オールイン">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=DM+Serif+Display&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 暗い部屋に置いた縦長のポーカーテーブル。上がCPUの席、真ん中に場の5枚、下がYouの席。テーブルの下にチップ型のボタン */
:root {
  --room: #0d0f0e;
  --felt: #17604a;
  --felt-deep: #0b3a2d;
  --rail: #3b2213;
  --rail-hi: #6b3f22;
  --brass: #e3bd62;
  --brass-deep: #9c7426;
  --chip: #b3202f;
  --card: #fbf8f1;
  --ink: #1b1c20;
  --red: #c42a3a;
  --text: #eef5f0;
  --muted: #9dbfb0;
  --display: "Big Shoulders Display", "Arial Narrow", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --rank: "DM Serif Display", Georgia, "Times New Roman", serif;
  --cw: min(13.5vw, 64px, 9dvh);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(90% 60% at 50% 40%, #1b2320 0%, var(--room) 70%), var(--room);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 14px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* テーブル：木のふち＋真鍮の線＋フェルト */
.table {
  flex: 1;
  min-height: 0;
  border-radius: 999px / 34%;
  padding: 13px;
  background: linear-gradient(160deg, var(--rail-hi), var(--rail) 45%, #22130a);
  box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
}
.felt {
  height: 100%;
  border-radius: 999px / 32%;
  background:
    radial-gradient(80% 55% at 50% 45%, var(--felt) 0%, var(--felt-deep) 100%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brass) 55%, transparent), inset 0 0 50px rgba(0,0,0,.55);
  display: grid;
  grid-template-rows: 1fr auto 1fr;
  align-items: center;
  padding: 7% 4%;
  position: relative;
  overflow: hidden;
}
.felt::before {
  content: "ALL IN";
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--display);
  font-weight: 900;
  font-size: min(30vw, 150px);
  letter-spacing: .04em;
  color: rgba(0,0,0,.13);
  white-space: nowrap;
  pointer-events: none;
}

.seat { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; }
.seat.cpu { align-self: start; }
.seat.you { align-self: end; flex-direction: column-reverse; }
.plate {
  display: flex; align-items: center; gap: 10px;
  min-width: min(62vw, 240px);
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.08);
  transition: box-shadow .35s, border-color .35s;
}
.who { font-family: var(--display); font-weight: 900; font-size: 1.15rem; letter-spacing: .08em; width: 2.6em; }
.bar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--muted); border-radius: inherit; transition: width .7s cubic-bezier(.2,.8,.2,1), background .4s; }
.pct { font-family: var(--display); font-weight: 700; font-size: 1.15rem; width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; }
.seat.lead .bar i { background: var(--brass); }
.seat.lead .pct { color: var(--brass); }
.seat.win .plate { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 22px color-mix(in srgb, var(--brass) 55%, transparent); }
.hand { font-size: .8rem; font-weight: 700; color: var(--muted); min-height: 1.2em; letter-spacing: .04em; }
.seat.win .hand { color: var(--brass); }

.cards { display: flex; gap: 6px; justify-content: center; }
.card {
  width: var(--cw);
  aspect-ratio: 5 / 7;
  border-radius: 7px;
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  position: relative;
  display: grid;
  place-items: center;
  font-family: var(--rank);
  transition: transform .3s, opacity .3s, filter .3s;
}
.seat .card { width: calc(var(--cw) * 1.1); }
.card.red { color: var(--red); }
.card .rk { position: absolute; top: 5%; left: 9%; font-size: calc(var(--cw) * .36); line-height: 1; }
.card .st { font-size: calc(var(--cw) * .5); line-height: 1; margin-top: 24%; font-family: "Segoe UI Symbol", "Apple Symbols", sans-serif; }
.card.back {
  background:
    radial-gradient(circle at 50% 50%, transparent 0 32%, color-mix(in srgb, var(--brass) 45%, transparent) 33% 35%, transparent 36%),
    repeating-linear-gradient(45deg, transparent 0 5px, rgba(227,189,98,.22) 5px 6px),
    repeating-linear-gradient(-45deg, transparent 0 5px, rgba(227,189,98,.22) 5px 6px),
    var(--chip);
  border: 3px solid var(--card);
}
.card.empty { background: transparent; border: 1.5px dashed rgba(255,255,255,.18); box-shadow: none; }
.card.flip { animation: flip .36s ease-out; }
.card.drop { animation: drop .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
@keyframes drop { from { transform: translateY(-26px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.done .card:not(.used):not(.empty) { filter: brightness(.55); }
.done .card.used { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--brass), 0 6px 14px rgba(0,0,0,.5); }

.mid { display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; z-index: 1; }
.street { font-family: var(--display); font-weight: 700; letter-spacing: .3em; font-size: .8rem; color: var(--muted); min-height: 1em; }
.result { text-align: center; min-height: 3.2em; display: flex; flex-direction: column; justify-content: center; }
.result b { font-family: var(--display); font-weight: 900; font-size: 2.6rem; line-height: .95; letter-spacing: .06em; color: var(--brass); text-shadow: 0 2px 0 rgba(0,0,0,.45); }
.result b.lose { color: var(--text); }
.result small { font-size: .82rem; color: var(--text); opacity: .85; margin-top: 4px; }
.result.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* チップ型のボタン */
.go {
  align-self: center;
  width: 92px; height: 92px;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  background:
    radial-gradient(circle, var(--chip) 0 52%, transparent 53%),
    repeating-conic-gradient(var(--card) 0 15deg, var(--chip) 15deg 45deg);
  box-shadow: 0 0 0 4px var(--chip), 0 6px 0 4px #6e1019, 0 12px 24px rgba(0,0,0,.6);
  color: var(--card);
  font-family: var(--display);
  font-weight: 900;
  font-size: 1.25rem;
  letter-spacing: .06em;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: transform .08s, box-shadow .08s, filter .2s;
  flex-shrink: 0;
}
.go span { display: grid; place-items: center; width: 60%; height: 60%; border-radius: 50%; border: 2px dashed rgba(251,248,241,.55); }
.go:active { transform: translateY(5px); box-shadow: 0 0 0 4px var(--chip), 0 1px 0 4px #6e1019, 0 4px 10px rgba(0,0,0,.6); }
.go:disabled { filter: grayscale(.5) brightness(.7); cursor: default; }
.go:focus-visible { outline: 3px solid var(--brass); outline-offset: 6px; }
.hint { text-align: center; font-size: .75rem; color: var(--muted); margin-top: -6px; min-height: 1em; }

@media (prefers-reduced-motion: reduce) {
  .card.flip, .card.drop, .result.pop { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="table">
    <div class="felt" id="felt">
      <section class="seat cpu" id="seat-cpu">
        <div class="plate"><span class="who">CPU</span><span class="bar"><i id="bar-cpu"></i></span><span class="pct" id="pct-cpu">–</span></div>
        <div class="hand" id="hand-cpu"></div>
        <div class="cards" id="hole-cpu"></div>
      </section>

      <section class="mid">
        <div class="street" id="street"></div>
        <div class="cards" id="board"></div>
        <div class="result" id="result" aria-live="polite"></div>
      </section>

      <section class="seat you" id="seat-you">
        <div class="plate"><span class="who">YOU</span><span class="bar"><i id="bar-you"></i></span><span class="pct" id="pct-you">–</span></div>
        <div class="hand" id="hand-you"></div>
        <div class="cards" id="hole-you"></div>
      </section>
    </div>
  </div>

  <button class="go" id="go" type="button" aria-label="オールインで勝負する"><span>ALL<br>IN</span></button>
  <div class="hint" id="hint">チップを押して勝負</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SUITS = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const LABEL = r => ({ 10: '10', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[r] || String(r));
  const DECK = [];
  for (let r = 2; r <= 14; r++) for (const s of 'shdc') DECK.push({ r, s, k: r + s });
  const NAMES = ['ハイカード', 'ワンペア', 'ツーペア', 'スリーカード', 'ストレート', 'フラッシュ', 'フルハウス', 'フォーカード', 'ストレートフラッシュ'];

  // 7枚から5枚を選ぶ21通り
  const COMBOS = [];
  for (let a = 0; a < 7; a++) for (let b = a + 1; b < 7; b++) COMBOS.push([0,1,2,3,4,5,6].filter(i => i !== a && i !== b));

  function rand(n) {
    try { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; }
    catch (e) { return Math.floor(Math.random() * n); }
  }
  function shuffle(arr) {
    const d = arr.slice();
    for (let i = d.length - 1; i > 0; i--) { const j = rand(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
    return d;
  }

  // 5枚の強さを [役の番号, 比べる順の数字...] で返す
  function eval5(c) {
    const rs = c.map(x => x.r).sort((a, b) => b - a);
    const flush = c[0].s === c[1].s && c[0].s === c[2].s && c[0].s === c[3].s && c[0].s === c[4].s;
    const cnt = {};
    for (const r of rs) cnt[r] = (cnt[r] || 0) + 1;
    const g = Object.keys(cnt).map(r => [+r, cnt[r]]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
    const ord = g.map(x => x[0]);
    let st = 0;
    if (g.length === 5) {
      if (rs[0] - rs[4] === 4) st = rs[0];
      else if (rs[0] === 14 && rs[1] === 5) st = 5;
    }
    if (st && flush) return [8, st];
    if (g[0][1] === 4) return [7, ...ord];
    if (g[0][1] === 3 && g[1][1] === 2) return [6, ...ord];
    if (flush) return [5, ...rs];
    if (st) return [4, st];
    if (g[0][1] === 3) return [3, ...ord];
    if (g[0][1] === 2 && g[1][1] === 2) return [2, ...ord];
    if (g[0][1] === 2) return [1, ...ord];
    return [0, ...rs];
  }
  function cmp(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  function best7(cards) {
    let best = null, idx = null;
    for (const co of COMBOS) {
      const s = eval5(co.map(i => cards[i]));
      if (!best || cmp(s, best) > 0) { best = s; idx = co; }
    }
    return { score: best, idx };
  }
  const handName = s => (s[0] === 8 && s[1] === 14) ? 'ロイヤルフラッシュ' : NAMES[s[0]];

  // 勝率計算用の速い版：7枚の強さを1つの数にする（大きいほど強い。eval5 と同じ並び）
  function topStraight(mask) {
    for (let h = 14; h >= 5; h--) if (((mask >> (h - 4)) & 31) === 31) return h;
    return (mask & 0x403C) === 0x403C ? 5 : 0;   // A-2-3-4-5
  }
  function pack(cat, ks) {
    let v = cat;
    for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] || 0);
    return v;
  }
  function score7(cards) {
    const cnt = new Array(15).fill(0), sc = { s: 0, h: 0, d: 0, c: 0 }, sm = { s: 0, h: 0, d: 0, c: 0 };
    let mask = 0;
    for (const x of cards) { cnt[x.r]++; sc[x.s]++; sm[x.s] |= 1 << x.r; mask |= 1 << x.r; }
    let fs = null;
    for (const s in sc) if (sc[s] >= 5) fs = s;
    if (fs) { const h = topStraight(sm[fs]); if (h) return pack(8, [h]); }
    const quads = [], trips = [], pairs = [], singles = [];
    for (let r = 14; r >= 2; r--) {
      if (cnt[r] === 4) quads.push(r); else if (cnt[r] === 3) trips.push(r);
      else if (cnt[r] === 2) pairs.push(r); else if (cnt[r] === 1) singles.push(r);
    }
    const highestExcept = ex => { for (let r = 14; r >= 2; r--) if (cnt[r] && !ex.includes(r)) return r; return 0; };
    if (quads.length) return pack(7, [quads[0], highestExcept([quads[0]])]);
    if (trips.length && (trips.length > 1 || pairs.length)) {
      const p = Math.max(trips[1] || 0, pairs[0] || 0);
      return pack(6, [trips[0], p]);
    }
    if (fs) {
      const ks = [];
      for (let r = 14; r >= 2 && ks.length < 5; r--) if (sm[fs] & (1 << r)) ks.push(r);
      return pack(5, ks);
    }
    const st = topStraight(mask);
    if (st) return pack(4, [st]);
    if (trips.length) return pack(3, [trips[0], ...singles.slice(0, 2)]);
    if (pairs.length >= 2) return pack(2, [pairs[0], pairs[1], highestExcept([pairs[0], pairs[1]])]);
    if (pairs.length) return pack(1, [pairs[0], ...singles.slice(0, 3)]);
    return pack(0, singles.slice(0, 5));
  }

  // 勝率：残りが3枚以上なら試しに配って見積もり、2枚以下なら全通りを数える
  function equity(Y, C, board) {
    const used = new Set([...Y, ...C, ...board].map(x => x.k));
    const rest = DECK.filter(x => !used.has(x.k));
    const need = 5 - board.length;
    let y = 0, c = 0, t = 0;
    const run = add => {
      const b = board.concat(add);
      const d = score7(Y.concat(b)) - score7(C.concat(b));
      if (d > 0) y++; else if (d < 0) c++; else t++;
    };
    if (need === 0) run([]);
    else if (need === 1) for (const a of rest) run([a]);
    else if (need === 2) for (let i = 0; i < rest.length; i++) for (let j = i + 1; j < rest.length; j++) run([rest[i], rest[j]]);
    else {
      const N = 15000, r = rest.slice();
      for (let n = 0; n < N; n++) {
        for (let i = 0; i < need; i++) { const j = i + Math.floor(Math.random() * (r.length - i)); [r[i], r[j]] = [r[j], r[i]]; }
        run(r.slice(0, need));
      }
    }
    const all = y + c + t;
    return { you: y / all * 100, cpu: c / all * 100, tie: t / all * 100 };
  }

  function cardEl(c, anim) {
    const el = document.createElement('div');
    el.className = 'card' + (anim ? ' ' + anim : '');
    if (c === 'back') { el.classList.add('back'); return el; }
    if (!c) { el.classList.add('empty'); return el; }
    if (c.s === 'h' || c.s === 'd') el.classList.add('red');
    el.setAttribute('aria-label', SUITS[c.s] + LABEL(c.r));
    el.innerHTML = '<span class="rk">' + LABEL(c.r) + '</span><span class="st">' + SUITS[c.s] + '</span>';
    return el;
  }

  const felt = $('felt');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];

  function showEquity(e) {
    const fmt = v => v >= 99.95 ? '100%' : v < 0.05 ? '0%' : v.toFixed(1) + '%';
    $('pct-you').textContent = fmt(e.you); $('pct-cpu').textContent = fmt(e.cpu);
    $('bar-you').style.width = e.you + '%'; $('bar-cpu').style.width = e.cpu + '%';
    $('seat-you').classList.toggle('lead', e.you > e.cpu);
    $('seat-cpu').classList.toggle('lead', e.cpu > e.you);
  }
  function resetTable() {
    felt.classList.remove('done');
    for (const k of ['you', 'cpu']) {
      $('seat-' + k).classList.remove('win', 'lead');
      $('hand-' + k).textContent = '';
      $('pct-' + k).textContent = '–';
      $('bar-' + k).style.width = '0';
    }
    $('result').innerHTML = ''; $('result').className = 'result';
    $('street').textContent = '';
  }

  function play() {
    timers.forEach(clearTimeout); timers = [];
    resetTable();
    $('go').disabled = true;
    $('hint').textContent = '';

    const d = shuffle(DECK);
    const Y = [d[0], d[2]], C = [d[1], d[3]];
    const board = [d[5], d[6], d[7], d[9], d[11]];

    $('hole-you').replaceChildren(...Y.map(x => cardEl(x, 'drop')));
    $('hole-cpu').replaceChildren(...C.map(x => cardEl(x, 'drop')));
    $('board').replaceChildren(...board.map(() => cardEl('back')));

    // 先に全部の段階の勝率を出しておく（配った直後の見積もりが一番重い）
    const eq = [equity(Y, C, []), equity(Y, C, board.slice(0, 3)), equity(Y, C, board.slice(0, 4))];
    const ry = best7(Y.concat(board)), rc = best7(C.concat(board));
    const res = cmp(ry.score, rc.score);

    const reveal = (from, to, name) => {
      for (let i = from; i < to; i++) $('board').children[i].replaceWith(cardEl(board[i], 'flip'));
      $('street').textContent = name;
    };
    const finish = () => {
      $('street').textContent = 'SHOWDOWN';
      showEquity({ you: res > 0 ? 100 : res === 0 ? 50 : 0, cpu: res < 0 ? 100 : res === 0 ? 50 : 0 });
      $('hand-you').textContent = handName(ry.score);
      $('hand-cpu').textContent = handName(rc.score);
      const mark = (holeId, r) => r.idx.forEach(i => {
        (i < 2 ? $(holeId).children[i] : $('board').children[i - 2]).classList.add('used');
      });
      if (res >= 0) mark('hole-you', ry);
      if (res <= 0) mark('hole-cpu', rc);
      if (res > 0) $('seat-you').classList.add('win');
      if (res < 0) $('seat-cpu').classList.add('win');
      felt.classList.add('done');
      const r = $('result');
      if (res > 0) r.innerHTML = '<b>YOU WIN</b><small>Youの勝ち・' + handName(ry.score) + '</small>';
      else if (res < 0) r.innerHTML = '<b class="lose">CPU WINS</b><small>CPUの勝ち・' + handName(rc.score) + '</small>';
      else r.innerHTML = '<b class="lose">CHOP</b><small>引き分け。もう一回どうぞ</small>';
      r.className = 'result pop';
      $('go').disabled = false;
      $('hint').textContent = res === 0 ? 'チップを押して配り直す' : 'もう一回なら、チップを押す';
    };

    if (reduce) {
      reveal(0, 5, ''); finish(); return;
    }
    const at = (ms, fn) => timers.push(setTimeout(fn, ms));
    at(700, () => { $('street').textContent = 'PRE-FLOP'; showEquity(eq[0]); });
    at(1900, () => { reveal(0, 3, 'FLOP'); showEquity(eq[1]); });
    at(3100, () => { reveal(3, 4, 'TURN'); showEquity(eq[2]); });
    at(4300, () => { reveal(4, 5, 'RIVER'); });
    at(4900, finish);
  }

  // 開いたときは裏向きで待つ
  $('hole-you').replaceChildren(cardEl('back'), cardEl('back'));
  $('hole-cpu').replaceChildren(cardEl('back'), cardEl('back'));
  $('board').replaceChildren(...[0,1,2,3,4].map(() => cardEl(null)));

  $('go').addEventListener('click', () => requestAnimationFrame(() => setTimeout(play, 0)));

  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
})();
</script>
</body>
</html>
